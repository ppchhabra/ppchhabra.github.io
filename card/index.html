<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Contact Card</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body {
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .vcard-box {
      margin-top: 0;
      width: 100%;
    }
    .vcard-website {
      margin-top: 6px;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .vcard-website a {
      color: #212529;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="vcard-box">
    <img src="../img/squaremug.png" alt="Profile" class="vcard-img">

    <!-- Header Info -->
    <div class="vcard-title" id="vcard-fn"></div>
    <div class="vcard-sub" id="vcard-title"></div>
    <div class="vcard-sub" id="vcard-subtitle"></div>
    <div class="vcard-sub" id="vcard-org"></div>

    <!-- Download Button -->
    <a href="contact.vcf" class="vcard-btn vcard-btn-primary" download="Param_Chhabra.vcf">ADD TO CONTACTS</a>

    <!-- Row 1: Email & LinkedIn -->
    <div class="vcard-grid">
      <a id="vcard-email" href="#" class="vcard-btn vcard-btn-outline">EMAIL</a>
      <a id="vcard-linkedin" href="#" target="_blank" rel="noopener noreferrer" class="vcard-btn vcard-btn-outline">LINKEDIN</a>
    </div>

    <!-- Row 2: AI4DA & Faculty Page -->
    <div class="vcard-grid">
      <a id="vcard-ai4da" href="#" target="_blank" rel="noopener noreferrer" class="vcard-btn vcard-btn-outline">AI4DA</a>
      <a id="vcard-faculty" href="#" target="_blank" rel="noopener noreferrer" class="vcard-btn vcard-btn-outline">FACULTY PAGE</a>
    </div>

    <!-- Office & Address -->
    <div class="vcard-label">OFFICE // ADDRESS</div>
    <div class="vcard-text" id="vcard-address"></div>

    <!-- Website Link -->
    <div class="vcard-label">WEBSITE</div>
    <div class="vcard-website">
      <a id="vcard-web-link" href="#" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      fetch('contact.vcf?v=' + new Date().getTime())
        .then(response => {
          if (!response.ok) throw new Error("Could not load contact.vcf file.");
          return response.text();
        })
        .then(vcardData => {
          // Parse Name
          const fn = vcardData.match(/^FN.*:(.*)$/im);
          if (fn && fn[1].trim()) {
            document.getElementById('vcard-fn').innerText = fn[1].trim();
            document.title = fn[1].trim() + " | Contact";
          }

          // Parse Main Title
          const title = vcardData.match(/^TITLE.*:(.*)$/im);
          if (title && title[1].trim()) {
            document.getElementById('vcard-title').innerText = title[1].trim();
          }

          // Parse Subtitle from NOTE
          const subtitle = vcardData.match(/^(?:NOTE|X-SUBTITLE)(?:;[^:]*)?:(.*)$/im);
          if (subtitle && subtitle[1].trim()) {
            document.getElementById('vcard-subtitle').innerText = subtitle[1].trim();
            document.getElementById('vcard-subtitle').style.display = 'block';
          } else {
            document.getElementById('vcard-subtitle').style.display = 'none';
          }

          // Parse Organization
          const org = vcardData.match(/^ORG.*:(.*)$/im);
          if (org && org[1].trim()) {
            document.getElementById('vcard-org').innerText = org[1].trim().split(';')[0];
          }

          // Parse Email
          const email = vcardData.match(/^EMAIL.*:(.*)$/im);
          if (email && email[1].trim()) {
            document.getElementById('vcard-email').href = "mailto:" + email[1].trim();
          }

          // Parse Website URL
          const website = vcardData.match(/^URL;(TYPE=WORK|TYPE=Website|WORK):(.*)$/im);
          if (website && website[2].trim()) {
            const webUrl = website[2].trim();
            const webLinkEl = document.getElementById('vcard-web-link');
            webLinkEl.href = webUrl;
            webLinkEl.innerText = webUrl.replace(/^https?:\/\//, '');
          }

          // Parse Custom Action Buttons
          const linkedin = vcardData.match(/^URL;TYPE=LinkedIn:(.*)$/im);
          if (linkedin && linkedin[1].trim()) {
            document.getElementById('vcard-linkedin').href = linkedin[1].trim();
          }

          const faculty = vcardData.match(/^URL;TYPE=Faculty:(.*)$/im);
          if (faculty && faculty[1].trim()) {
            document.getElementById('vcard-faculty').href = faculty[1].trim();
          }

          const ai4da = vcardData.match(/^URL;TYPE=AI4DA:(.*)$/im);
          if (ai4da && ai4da[1].trim()) {
            document.getElementById('vcard-ai4da').href = ai4da[1].trim();
          }

          // Parse Address & Phone
          const adrMatch = vcardData.match(/^ADR.*:(.*)$/im);
          const telMatch = vcardData.match(/^TEL.*:(.*)$/im);
          
          let addressHTML = "";
          if (adrMatch && adrMatch[1].trim()) {
            addressHTML = adrMatch[1]
              .replace(/\\;/g, ';')
              .split(';')
              .map(s => s.trim())
              .filter(Boolean)
              .join('<br>');
          }
          if (telMatch && telMatch[1].trim()) {
            addressHTML += (addressHTML ? "<br>" : "") + "Phone: " + telMatch[1].trim();
          }
          if (addressHTML) {
            document.getElementById('vcard-address').innerHTML = addressHTML;
          }
        })
        .catch(err => {
          console.error("Error parsing vCard file:", err);
        });
    });
  </script>

</body>
</html>
